<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CF Labs | Closer Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0d0f0b;--surface:#141610;--card:#1a1c15;--border:#252820;
  --copper:#B87C4C;--copper-light:#C9A07A;--copper-dim:rgba(184,124,76,0.12);
  --tan:#BF9B6F;--white:#F0EDE6;--grey:#6a6c60;--dim:#8a8c80;
  --red:#c0392b;--red-dim:rgba(192,57,43,0.08);--green:#4a9a60;
  --grad:linear-gradient(135deg,#B87C4C,#C9A07A);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--white);font-family:'Barlow',sans-serif;line-height:1.5;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* SETUP */

/* SELECT */
#screen-select{overflow-y:auto;}
.sel-hdr{padding:40px 56px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:flex-end;}
.lab-badge{display:inline-flex;align-items:center;gap:8px;background:var(--copper-dim);border:1px solid rgba(184,124,76,.2);border-radius:20px;padding:5px 14px;margin-bottom:12px;}
.lab-badge span{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--copper);}
.bdot{width:6px;height:6px;border-radius:50%;background:var(--copper);animation:bl 2s infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.3;}}
.sel-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.93;}
.sel-title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sel-sub{font-size:14px;color:var(--dim);line-height:1.5;margin-top:8px;}
.pgrid{padding:32px 56px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s;}
.pcard:hover{border-color:var(--copper);transform:translateY(-3px);box-shadow:0 10px 36px rgba(0,0,0,.4);}
.pc-top{padding:18px 18px 0;display:flex;justify-content:space-between;}
.pdiff{display:flex;gap:3px;align-items:center;}
.pd{width:7px;height:7px;border-radius:50%;background:#252820;}
.pd.on{background:var(--copper);}
.pdlbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--grey);margin-left:5px;}
.pnum{font-family:'Barlow Condensed',sans-serif;font-size:44px;font-weight:900;color:var(--copper);opacity:.12;line-height:1;}
.pc-body{padding:6px 18px 18px;}
.pname{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;text-transform:uppercase;margin-bottom:2px;}
.pmeta{font-size:12px;color:var(--grey);margin-bottom:10px;}
.pobjection{font-size:13px;color:#d97060;font-style:italic;line-height:1.5;padding:10px 12px;background:var(--red-dim);border-radius:6px;border-left:2px solid rgba(192,57,43,.3);}
.pc-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;}
.pbtn{background:var(--grad);border:none;padding:8px 18px;color:white;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border-radius:5px;cursor:pointer;}

/* SESSION */
#screen-session{display:none;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 200px;}
#screen-session.active{display:grid;}
.sh{grid-column:1/-1;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);display:flex;justify-content:space-between;align-items:center;}
.sh-l{display:flex;align-items:center;gap:14px;}
.back-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:5px 12px;border-radius:5px;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.15s;}
.back-btn:hover{border-color:var(--copper);color:var(--copper);}
.sh-title{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:1px;}
.sh-diff{display:flex;gap:3px;}
.shd{width:6px;height:6px;border-radius:50%;background:#252820;}
.shd.on{background:var(--copper);}
.close-btn{background:var(--grad);border:none;padding:9px 22px;color:white;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;border-radius:5px;cursor:pointer;transition:.2s;}
.close-btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(184,124,76,.4);}

/* Chat */
.chat{grid-column:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;}
.context-card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:16px 18px;margin-bottom:2px;}
.cc-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--copper);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.cc-row{display:flex;gap:10px;margin-bottom:6px;align-items:flex-start;font-size:13px;}
.cc-row:last-child{margin-bottom:0;}
.cc-key{color:var(--grey);min-width:80px;font-weight:600;}
.cc-val{color:var(--dim);line-height:1.5;}
.cc-val strong{color:var(--copper-light);}
.objection-pill{background:var(--red-dim);border:1px solid rgba(192,57,43,.25);border-radius:7px;padding:12px 16px;font-size:14px;color:#d97060;font-style:italic;line-height:1.6;text-align:center;}
.objection-pill::before{content:'THEIR OBJECTION  ';font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;font-style:normal;display:block;margin-bottom:6px;opacity:.6;}
.msg{display:flex;flex-direction:column;max-width:80%;}
.msg.prospect{align-self:flex-start;}
.msg.consultant{align-self:flex-end;}
.mlbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.msg.prospect .mlbl{color:var(--grey);}
.msg.consultant .mlbl{color:var(--copper);text-align:right;}
.mbbl{padding:12px 16px;border-radius:9px;font-size:14px;line-height:1.7;}
.msg.prospect .mbbl{background:#181a14;border:1px solid var(--border);color:var(--white);border-bottom-left-radius:2px;}
.msg.consultant .mbbl{background:rgba(184,124,76,.1);border:1px solid rgba(184,124,76,.2);color:var(--white);border-bottom-right-radius:2px;}
.typing{align-self:flex-start;display:none;}
.typing.show{display:flex;flex-direction:column;}
.tbbl{background:#181a14;border:1px solid var(--border);border-radius:9px;border-bottom-left-radius:2px;padding:12px 16px;display:flex;gap:5px;align-items:center;}
.td{width:6px;height:6px;border-radius:50%;background:var(--grey);animation:tdot 1.2s infinite;}
.td:nth-child(2){animation-delay:.2s;}
.td:nth-child(3){animation-delay:.4s;}
@keyframes tdot{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-3px);}}

/* Sidebar */
.sidebar{grid-column:2;border-left:1px solid var(--border);background:var(--surface);padding:20px 16px;display:flex;flex-direction:column;gap:20px;overflow:hidden;}
.sblbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--grey);margin-bottom:10px;}
.mstack{display:flex;flex-direction:column;gap:10px;}
.mrow{display:flex;align-items:center;gap:8px;}
.mdot{width:12px;height:12px;border-radius:50%;background:#252820;border:1px solid var(--border);flex-shrink:0;transition:all .5s ease;}
.mdot.lit{background:var(--copper);border-color:var(--copper);box-shadow:0 0 10px rgba(184,124,76,.5);animation:dg 2.5s infinite;}
@keyframes dg{0%,100%{box-shadow:0 0 6px rgba(184,124,76,.4);}50%{box-shadow:0 0 14px rgba(184,124,76,.8);}}
.mline{width:1px;height:8px;background:var(--border);margin-left:5px;}
.pmini{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:12px;}
.pmn{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;text-transform:uppercase;margin-bottom:1px;}
.pmm{font-size:11px;color:var(--grey);}
.pxf{font-size:11px;color:var(--tan);font-style:italic;margin-top:6px;line-height:1.4;padding-top:6px;border-top:1px solid var(--border);}

/* Input */
.inp-area{grid-column:1;border-top:1px solid var(--border);padding:14px 22px;background:var(--surface);}
.inp-row{display:flex;gap:8px;align-items:flex-end;}
.cinp{flex:1;background:var(--card);border:1px solid var(--border);color:var(--white);padding:11px 14px;border-radius:7px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;resize:none;min-height:44px;max-height:110px;transition:.2s;line-height:1.5;}
.cinp:focus{border-color:var(--copper);}
.cinp::placeholder{color:var(--grey);}
.sbtn{background:var(--copper-dim);border:1px solid rgba(184,124,76,.3);color:var(--copper);padding:11px 16px;border-radius:7px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;transition:.2s;white-space:nowrap;}
.sbtn:hover{background:var(--copper);color:white;}
.sbtn:disabled{opacity:.3;cursor:not-allowed;}
.sb-foot{grid-column:2;border-top:1px solid var(--border);border-left:1px solid var(--border);background:var(--surface);}

/* Error */
.err-msg{background:var(--red-dim);border:1px solid rgba(192,57,43,.25);border-radius:8px;padding:13px 16px;font-size:13px;color:#d97060;line-height:1.6;max-width:82%;}
.err-msg strong{display:block;margin-bottom:4px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;font-size:11px;}

/* DEBRIEF */
#screen-debrief{overflow-y:auto;}
.dbhdr{padding:44px 56px 28px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10;}
.dbey{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--copper);margin-bottom:12px;}
.dbtitle{font-family:'Barlow Condensed',sans-serif;font-size:clamp(30px,5vw,50px);font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.93;}
.dbtitle em{font-style:normal;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.dbwrap{padding:36px 56px 80px;max-width:860px;}
.score-row{display:flex;align-items:center;gap:26px;margin-bottom:36px;}
.scircle{width:100px;height:100px;border-radius:50%;border:2px solid var(--copper);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.snum{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:900;color:var(--copper);line-height:1;}
.slbl2{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--grey);}
.sgrade{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;margin-bottom:3px;}
.sfb{font-size:14px;color:var(--dim);line-height:1.6;max-width:480px;}
.reveal-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:24px;}
.rlbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--copper);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.rname{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;margin-bottom:2px;}
.rmeta2{font-size:13px;color:var(--grey);margin-bottom:12px;}
.rstory{font-size:14px;color:var(--dim);line-height:1.75;}
.rxf{background:var(--copper-dim);border:1px solid rgba(184,124,76,.2);border-radius:7px;padding:14px 16px;margin-top:12px;}
.rxfl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--copper);margin-bottom:5px;opacity:.7;}
.rxft{font-size:14px;color:var(--copper-light);font-style:italic;line-height:1.6;}
.dbsec{margin-bottom:24px;}
.dbslbl{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.dbslbl.cu{color:var(--copper);}
.dbslbl.gr{color:var(--green);}
.dbslbl.rd{color:rgba(192,57,43,.8);}
.msr{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:15px;margin-bottom:8px;display:flex;gap:14px;align-items:flex-start;}
.msr.hit{border-color:rgba(74,154,96,.3);background:rgba(74,154,96,.04);}
.msrd{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-top:2px;}
.msrd.hit{background:var(--green);}
.msrd.miss{background:#252820;}
.msrn{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.msrn.hit{color:var(--green);}
.msrn.miss{color:var(--grey);}
.msre{font-size:13px;color:var(--dim);line-height:1.55;}
.msrm{font-size:12px;color:var(--tan);font-style:italic;margin-top:5px;}
.mitem{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:7px;font-size:13px;color:var(--dim);line-height:1.6;}
.mitem.hit{border-left:3px solid var(--green);}
.mitem.miss{border-left:3px solid rgba(192,57,43,.5);}
.focus-card{background:var(--copper-dim);border:1px solid rgba(184,124,76,.25);border-radius:7px;padding:16px 18px;font-size:14px;color:var(--copper-light);line-height:1.65;}
.flbl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--copper);margin-bottom:7px;opacity:.7;display:block;}
.dbactions{display:flex;gap:10px;margin-top:28px;}
.dba{padding:12px 24px;border-radius:7px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.2s;}
.dba.pri{background:var(--grad);border:none;color:white;}
.dba.pri:hover{opacity:.9;}
.dba.sec{background:none;border:1px solid var(--border);color:var(--dim);}
.dba.sec:hover{border-color:var(--copper);color:var(--copper);}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(13,15,11,.92);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.overlay.show{display:flex;}
.spinner{width:36px;height:36px;border:2px solid var(--border);border-top-color:var(--copper);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.overlay-txt{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dim);}

@media(max-width:680px){
  .sel-hdr,.pgrid,.dbwrap{padding-left:20px;padding-right:20px;}
  .pgrid{grid-template-columns:1fr;}
  #screen-session{grid-template-columns:1fr;}
  .sidebar,.sb-foot{display:none;}
  }
</style>
</head>
<body>

<div class="overlay" id="overlay"><div class="spinner"></div><div class="overlay-txt" id="overlayTxt">Generating debrief...</div></div>

<!-- SELECT -->
<div class="screen active" id="screen-select">
  <div class="sel-hdr">
    <div>
      <div class="lab-badge"><div class="bdot"></div><span>CF Labs · Closer Lab · AI-Powered</span></div>
      <h1 class="sel-title">Choose Your<br><em>Objection.</em></h1>
      <p class="sel-sub">Price is on the table. They just said no. Apply LIGO and close.</p>
    </div>
  </div>
  <div class="pgrid" id="pgrid"></div>
</div>

<!-- SESSION -->
<div class="screen" id="screen-session">
  <div class="sh">
    <div class="sh-l">
      <button class="back-btn" onclick="goBack()">← Scenarios</button>
      <div class="sh-title" id="shTitle">Closer Lab</div>
      <div class="sh-diff" id="shDiff"></div>
    </div>
    <button class="close-btn" onclick="endSession()">Let's Get Started →</button>
  </div>
  <div class="chat" id="chat">
    <div class="typing" id="typing">
      <div class="mlbl" id="typLbl">Prospect</div>
      <div class="tbbl"><div class="td"></div><div class="td"></div><div class="td"></div></div>
    </div>
  </div>
  <div class="sidebar">
    <div>
      <div class="sblbl">LIGO Progress</div>
      <div class="mstack">
        <div class="mrow"><div class="mdot" id="d0"></div></div>
        <div style="padding-left:5px;"><div class="mline"></div></div>
        <div class="mrow"><div class="mdot" id="d1"></div></div>
        <div style="padding-left:5px;"><div class="mline"></div></div>
        <div class="mrow"><div class="mdot" id="d2"></div></div>
        <div style="padding-left:5px;"><div class="mline"></div></div>
        <div class="mrow"><div class="mdot" id="d3"></div></div>
        <div style="padding-left:5px;"><div class="mline"></div></div>
        <div class="mrow"><div class="mdot" id="d4"></div></div>
      </div>
    </div>
    <div class="pmini" id="pmini"></div>
  </div>
  <div class="inp-area">
    <div class="inp-row">
      <textarea class="cinp" id="cinp" placeholder="Your response..." rows="1" onkeydown="onK(event)" oninput="rz(this)"></textarea>
      <button class="sbtn" id="sbtn" onclick="sendMsg()">Send</button>
    </div>
  </div>
  <div class="sb-foot"></div>
</div>

<!-- DEBRIEF -->
<div class="screen" id="screen-debrief">
  <div class="dbhdr">
    <div class="dbey">CF Labs · Closer Lab · Session Complete</div>
    <h1 class="dbtitle">Session<br><em>Debrief.</em></h1>
  </div>
  <div class="dbwrap" id="dbwrap"></div>
</div>

<iframe name="cfhid" id="cfhid" style="display:none;"></iframe>
<form id="cform" target="cfhid" method="GET" action="https://script.google.com/a/macros/cityfitness.com/s/AKfycbzZokf4OQGpHYEkb_9mcVdJ-t9jop9RWIpclIcLSjTWRcBQfeDJ751bl0qO8k7VrZwe/exec">
  <input type="hidden" name="employee" id="femp"/>
  <input type="hidden" name="topic" id="ftopic"/>
  <input type="hidden" name="result" id="fresult"/>
</form>

<script>
/* ══════════════════════════════
   SCENARIO DATA
══════════════════════════════ */
const PP=[
{
  id:1,name:"Jamie Torres",age:32,diff:1,dlbl:"Beginner",
  meta:"Nurse · 4 months postpartum",
  objectionLine:'"I think I just want to take a little more time to think about it."',
  context:{
    goals:"Get her energy and fitness back after having her first baby",
    xfactor:"Her daughter is watching everything she does. She wants to model strength and health — not just talk about it.",
    tier:"Performance+",situation:"First-time gym member. Toured fully. All HACCL confirmed yes. Price presented."
  },
  xfactor:"Her daughter is watching. She wants to model strength and self-care — not just talk about it.",
  fullstory:"Jamie had her daughter 4 months ago and has been putting her own health last. She mentioned her daughter twice during discovery. The real reason she's here isn't weight loss — it's wanting to be the example her daughter sees. 'I want her to grow up knowing her mom takes care of herself.'",
  systemPrompt:`You are playing Jamie Torres, a 32-year-old nurse who is 4 months postpartum. You just heard the price for Performance+ and said you want to think about it.

YOUR OBJECTION: "I think I just want to take a little more time to think about it."

WHAT'S REALLY GOING ON: You're genuinely excited about this place. But you've been putting yourself last for four months and you're not sure you're ready to commit to something for yourself. There's a small voice asking "what if I don't follow through?" You don't want to waste money.

YOUR CONTEXT (the consultant knows this from discovery):
- You want to get your energy and fitness back
- You mentioned your daughter twice — she's 4 months old
- Your real X-Factor: you want your daughter to grow up watching a mom who takes care of herself. "I don't want her to see me always putting myself last."
- You said you'd realistically use Revive 3-4x/week and take 2 classes a week

HOW YOU RESPOND TO GOOD LIGO:
- L (Listen): When the consultant doesn't argue immediately but acknowledges what you said — you soften slightly. "Yeah, I just... I don't know."
- I (Identify): When they genuinely empathize and name what you're feeling ("it sounds like you want to make sure this is the right time") — you confirm: "Yeah, exactly. I just don't want to start something and not finish it."
- G (Give Permission): When they agree with your instinct ("that's actually a healthy way to approach it") — your guard drops. You feel heard, not sold to.
- O (Offer Alternative): When they bring up your daughter and the modeling piece — this is the moment. You get quiet for a second. Then: "When you say it like that... yeah. I don't want her to see me always putting myself last."
- Re-Close (debit or credit): When asked directly after a strong Offer Alternative — you say yes.

HOW YOU RESPOND TO BAD LIGO:
- If they immediately argue or defend the price → "I hear you, but I really just need a few days."
- If they use "but" after empathizing → "Right, but I still just need to think."
- If they skip Give Permission and go straight to selling → you get more resistant

async function callAI(messages,maxTokens=400,sysOverride){
  try{

    });
    const data=await res.json();
    if(!res.ok){
      const msg=data.error?.message||'API error';
      if(res.status===401){addErrMsg('API key invalid. Tap ⚙ API Key to update.');}
      else addErrMsg(`API error (${res.status}): ${msg}`);
      return null;
    }
    return data.content?.map(b=>b.text||'').join('')||'';
  }catch(e){
    console.error(e);
    if(e instanceof TypeError&&e.message.includes('fetch'))

    return null;
  }
}

  return{text:textLines.join('\n').trim()||raw.trim(),milestones};
}

    ${d.strongMoments?.length?`<div class="dbsec"><div class="dbslbl gr">What Worked</div>${d.strongMoments.map(s=>`<div class="mitem hit">${s}</div>`).join('')}</div>`:''}
    ${d.missedMoments?.length?`<div class="dbsec"><div class="dbslbl rd">Missed Opportunities</div>${d.missedMoments.map(m=>`<div class="mitem miss">${m}</div>`).join('')}</div>`:''}
    ${d.focusNext?`<div class="dbsec"><div class="dbslbl cu">Focus For Next Session</div><div class="focus-card"><span class="flbl">One Thing</span>${d.focusNext}</div></div>`:''}
    <div class="dbactions">
      <button class="dba pri" onclick="startSession(${CP.id})">Try Again →</button>
      <button class="dba sec" onclick="goBack()">Choose Different Scenario</button>
    </div>`;
}

/* UI */
function addMsg(role,txt){
  const ch=document.getElementById('chat'),ti=document.getElementById('typing');
  const el=document.createElement('div');el.className='msg '+role;
  el.innerHTML=`<div class="mlbl">${role==='prospect'?CP.name.split(' ')[0]:'You'}</div><div class="mbbl">${esc(txt)}</div>`;
  ch.insertBefore(el,ti);scrollChat();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function scrollChat(){const c=document.getElementById('chat');setTimeout(()=>{c.scrollTop=c.scrollHeight;},50);}
function showTyping(on){const t=document.getElementById('typing');t.classList.toggle('show',on);if(on)scrollChat();}
function lightDot(key){const i=MK.indexOf(key);if(i<0)return;const d=document.getElementById('d'+i);if(d)d.classList.add('lit');}
function showOverlay(on,txt){const o=document.getElementById('overlay');o.classList.toggle('show',on);if(txt)document.getElementById('overlayTxt').textContent=txt;}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goBack(){active=false;CP=null;showScreen('screen-select');}
function onK(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function rz(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,110)+'px';}
function submitR(score){
  try{
    document.getElementById('femp').value=cname;
    document.getElementById('ftopic').value=`Closer Lab — ${CP.name} (Difficulty ${CP.diff})`;
    document.getElementById('fresult').value=score||Math.round((MS.size/5)*100);
    document.getElementById('cform').submit();
  }catch(e){}
}
</script>
